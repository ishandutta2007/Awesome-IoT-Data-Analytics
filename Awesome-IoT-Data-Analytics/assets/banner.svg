<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" style="background: linear-gradient(135deg, #0d1117 0%, #161b22 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.8" opacity="0.4" />
    </pattern>
    
    <!-- Gradient for Banner Accent -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Filters for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Grid -->
  <rect width="1200" height="320" fill="url(#grid)" />

  <!-- Dynamic / Animated Waves & Flow Lines (Background Layer) -->
  <g opacity="0.35">
    <!-- Animated Telemetry Wave 1 -->
    <path d="M -50 220 Q 200 120 450 230 T 950 180 T 1250 240" fill="none" stroke="url(#primary-grad)" stroke-width="3">
      <animate attributeName="d" 
               dur="10s" 
               repeatCount="indefinite"
               values="M -50 220 Q 200 120 450 230 T 950 180 T 1250 240;
                       M -50 200 Q 200 250 450 160 T 950 220 T 1250 190;
                       M -50 220 Q 200 120 450 230 T 950 180 T 1250 240" />
    </path>

    <!-- Animated Telemetry Wave 2 -->
    <path d="M -50 150 Q 300 260 600 140 T 1250 200" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,6">
      <animate attributeName="d" 
               dur="14s" 
               repeatCount="indefinite"
               values="M -50 150 Q 300 260 600 140 T 1250 200;
                       M -50 180 Q 300 120 600 220 T 1250 160;
                       M -50 150 Q 300 260 600 140 T 1250 200" />
    </path>
  </g>

  <!-- Dynamic IoT Sensor Data Nodes (Moving Dots in BG) -->
  <g opacity="0.6">
    <circle cx="920" cy="110" r="4" fill="#38bdf8">
      <animate attributeName="r" values="3;7;3" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="1040" cy="210" r="5" fill="#818cf8">
      <animate attributeName="r" values="4;8;4" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="150" cy="250" r="4" fill="#c084fc">
      <animate attributeName="r" values="2;6;2" dur="2.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Decorative Tech Graphic (Right Side Background) -->
  <g transform="translate(900, 60)" opacity="0.25">
    <polygon points="100,0 200,50 200,150 100,200 0,150 0,50" fill="none" stroke="url(#primary-grad)" stroke-width="2" />
    <polygon points="100,30 170,65 170,135 100,170 30,135 30,65" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="100" cy="100" r="30" fill="url(#primary-grad)" opacity="0.5" />
  </g>

  <!-- Foreground Title and Subtitle (Crisp & Unobscured) -->
  <g transform="translate(80, 0)">
    <!-- Top Accent Line -->
    <rect x="0" y="75" width="90" height="4" rx="2" fill="url(#primary-grad)" />

    <!-- Main Title -->
    <text x="0" y="135" fill="#ffffff" font-size="46" font-weight="800" letter-spacing="-0.5">
      Awesome IoT Data Analytics ⚡
    </text>

    <!-- Subtitle -->
    <text x="0" y="180" fill="#94a3b8" font-size="20" font-weight="500">
      Time-Series Analytics, Stream Processing &amp; Self-Hosted Telemetry Platforms
    </text>

    <!-- Category Pills / Badges (Static Foreground Element) -->
    <g transform="translate(0, 215)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#38bdf8" />
      <text x="30" y="21" fill="#cbd5e1" font-size="13" font-weight="600">Time-Series DBs</text>

      <!-- Pill 2 -->
      <rect x="175" y="0" width="165" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="191" cy="16" r="5" fill="#818cf8" />
      <text x="205" y="21" fill="#cbd5e1" font-size="13" font-weight="600">Stream Processing</text>

      <!-- Pill 3 -->
      <rect x="355" y="0" width="160" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="371" cy="16" r="5" fill="#c084fc" />
      <text x="385" y="21" fill="#cbd5e1" font-size="13" font-weight="600">IoT Dashboards</text>
    </g>
  </g>
</svg>
